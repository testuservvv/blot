<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BlotMate - Bazar Blot Score Tracker</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --neon-blue: #00f3ff;
      --neon-pink: #ff00ea;
      --bg-dark: #0a0a0f;
      --panel-dark: #16161e;
    }
    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: none;
    }
    
    /* Fancy Neon Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      height: 30px;
      margin: 10px 0;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 12px;
      cursor: pointer;
      background: #2a2a35;
      border-radius: 10px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    input[type=range]::-webkit-slider-thumb {
      height: 34px;
      width: 34px;
      border-radius: 50%;
      background: var(--neon-blue);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -11px;
      box-shadow: 0 0 15px var(--neon-blue);
      border: 3px solid #fff;
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }
    .slider-pink::-webkit-slider-thumb {
      background: var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neonBlue: '#00f3ff',
            neonPink: '#ff00ea',
            darkBg: '#0a0a0f',
            darkPanel: '#16161e',
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- UTILITIES ---
    const COMBO_VALUES = { terz: 20, fifty: 50, hundred: 100, fourOfAKind: 100, blotReblot: 20 };
    const MULTIPLIERS = { none: 1, kontra: 2, rekontra: 4 };

    const calculatePoints = (rawScore) => Math.round(rawScore / 10);

    // --- GAMES LIST COMPONENT ---
    function GamesList({ games, onNewGame, onResume, onDelete }) {
      return (
        <div className="min-h-screen flex flex-col p-6 space-y-6">
          <h1 className="text-4xl font-black text-center tracking-tighter mt-4" style={{textShadow: '0 0 20px var(--neon-blue)'}}>
            BLOT<span className="text-neonPink">MATE</span>
          </h1>

          <button 
            onClick={onNewGame}
            className="w-full py-5 rounded-2xl font-black text-xl bg-gradient-to-r from-neonBlue to-neonPink shadow-[0_0_20px_rgba(0,243,255,0.3)] active:scale-95 transition-transform text-white"
          >
            + NEW GAME
          </button>

          <div className="flex-1 overflow-y-auto space-y-4 pb-8">
            <h2 className="text-gray-400 font-bold uppercase tracking-widest text-sm mb-2">Game History</h2>
            {games.length === 0 && <p className="text-gray-600 text-center py-8">No saved games.</p>}
            {games.sort((a,b) => b.lastPlayed - a.lastPlayed).map(g => {
              const isGameOver = g.teams[0].total >= g.targetScore || g.teams[1].total >= g.targetScore;
              return (
                <div key={g.id} className={`bg-darkPanel p-5 rounded-2xl border border-gray-800 relative ${isGameOver ? 'opacity-60' : ''}`}>
                  {isGameOver && <div className="absolute top-0 right-0 bg-gray-800 text-xs px-3 py-1 rounded-bl-xl rounded-tr-2xl font-bold text-gray-300">FINISHED</div>}
                  <div className="flex justify-between items-center mb-3">
                     <div className="text-lg font-black text-neonBlue">{g.teams[0].name} <span className="text-white ml-1">{g.teams[0].total}</span></div>
                     <div className="text-gray-600 font-bold px-2">vs</div>
                     <div className="text-lg font-black text-neonPink"><span className="text-white mr-1">{g.teams[1].total}</span> {g.teams[1].name}</div>
                  </div>
                  <div className="flex justify-between items-center mt-4">
                     <span className="text-xs text-gray-500 font-medium">Target: {g.targetScore} • {new Date(g.date).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
                     <div className="flex gap-2">
                        <button onClick={() => onDelete(g.id)} className="p-2 bg-red-900/20 hover:bg-red-900/40 text-red-500 rounded-lg transition-colors">🗑️</button>
                        <button onClick={() => onResume(g.id)} className="px-5 py-2 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-lg transition-colors">
                          {isGameOver ? 'View' : 'Resume'}
                        </button>
                     </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- SETUP COMPONENT ---
    function SetupScreen({ onStart, onCancel }) {
      const [t1, setT1] = useState('');
      const [t2, setT2] = useState('');
      const [target, setTarget] = useState(151);

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center space-y-8 relative">
          <button onClick={onCancel} className="absolute top-6 left-6 text-gray-500 font-bold text-lg active:scale-95">✕ Cancel</button>
          
          <h2 className="text-4xl font-black mb-8 tracking-tighter text-white">
            GAME SETUP
          </h2>
          
          <div className="w-full max-w-sm space-y-4">
            <input 
              type="text" placeholder="Team 1 Name" value={t1} onChange={e => setT1(e.target.value)}
              className="w-full bg-darkPanel text-xl p-4 rounded-2xl border border-gray-800 focus:border-neonBlue focus:outline-none transition-colors"
            />
            <input 
              type="text" placeholder="Team 2 Name" value={t2} onChange={e => setT2(e.target.value)}
              className="w-full bg-darkPanel text-xl p-4 rounded-2xl border border-gray-800 focus:border-neonPink focus:outline-none transition-colors"
            />
          </div>

          <div className="space-y-3 w-full max-w-sm">
            <p className="text-gray-400 font-bold uppercase tracking-widest text-sm">Target Score</p>
            <div className="flex gap-4">
              {[101, 151, 301].map(score => (
                <button 
                  key={score} onClick={() => setTarget(score)}
                  className={`flex-1 py-4 text-xl font-bold rounded-2xl border-2 transition-all ${target === score ? 'border-neonBlue bg-blue-900/20 text-white' : 'border-gray-800 text-gray-500'}`}
                >
                  {score}
                </button>
              ))}
            </div>
          </div>

          <button 
            onClick={() => onStart(target, t1, t2)}
            className="w-full max-w-sm py-5 rounded-2xl font-black text-2xl bg-white text-black active:scale-95 transition-transform mt-4"
          >
            START MATCH
          </button>
        </div>
      );
    }

    // --- GAME BOARD COMPONENT (Active Game View) ---
    function GameBoard({ game, onUpdate, onExit }) {
      const [isRoundModalOpen, setIsRoundModalOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('bid');
      
      const getInitialRoundState = () => ({
        attacker: 0,
        suit: '♠️',
        bid: 8,
        isKaput: false,
        multiplier: 1,
        forcedBaite: false, // New Field for instant Baite
        combos: {
          0: { terz: 0, fifty: 0, hundred: 0, fourOfAKind: 0, blotReblot: 0 },
          1: { terz: 0, fifty: 0, hundred: 0, fourOfAKind: 0, blotReblot: 0 }
        },
        rawScoreA: 81,
        lastTrick: 0
      });

      const [roundState, setRoundState] = useState(getInitialRoundState());

      const isGameOver = game.teams[0].total >= game.targetScore || game.teams[1].total >= game.targetScore;
      const winner = game.teams[0].total > game.teams[1].total ? game.teams[0] : game.teams[1];

      const revertLastRound = () => {
        if (game.history.length === 0) return;
        const lastRound = game.history[game.history.length - 1];
        onUpdate({
          teams: game.teams.map((t, i) => ({ ...t, total: t.total - lastRound.pointsGained[i] })),
          dealer: (game.dealer - 1 + 2) % 2,
          history: game.history.slice(0, -1)
        });
      };

      const resolveRound = () => {
        const { attacker, bid, isKaput, multiplier, forcedBaite, combos, rawScoreA, lastTrick } = roundState;
        const defender = attacker === 0 ? 1 : 0;
        
        const getComboPoints = (teamId) => {
          let sum = 0;
          for (const [key, qty] of Object.entries(combos[teamId])) {
             sum += (COMBO_VALUES[key] / 10) * qty;
          }
          return sum;
        };

        const combosA = getComboPoints(0);
        const combosB = getComboPoints(1);
        
        const rawA = rawScoreA + (lastTrick === 0 ? 10 : 0);
        const rawB = (162 - rawScoreA) + (lastTrick === 1 ? 10 : 0);
        
        const cardsPointsA = calculatePoints(rawA);
        const cardsPointsB = calculatePoints(rawB);

        const attackerCards = attacker === 0 ? cardsPointsA : cardsPointsB;
        const defenderCards = attacker === 0 ? cardsPointsB : cardsPointsA;
        const attackerCombos = attacker === 0 ? combosA : combosB;
        const defenderCombos = attacker === 0 ? combosB : combosA;

        const totalAttackerPoints = attackerCards + attackerCombos;
        
        let finalPoints = [0, 0];
        let calculationDetails = ["", ""];
        
        // Auto-calculate opponent score if forced baite OR math dictates failure
        const isBaite = forcedBaite || (!isKaput && totalAttackerPoints < bid);
        const failedKaput = isKaput && (forcedBaite || rawScoreA !== (attacker === 0 ? 162 : 0));

        if (isBaite || failedKaput) {
          const penalty = isKaput ? Math.max(bid, 25) : bid;
          const totalDefenderGain = (penalty + 16 + attackerCombos + defenderCombos) * multiplier;
          
          finalPoints[attacker] = 0;
          finalPoints[defender] = totalDefenderGain;
          
          calculationDetails[attacker] = `Baite! 0 pts`;
          calculationDetails[defender] = `Bid(${penalty}) + Cards(16) + AllCombos(${attackerCombos + defenderCombos}) * X${multiplier} = ${totalDefenderGain}`;
        } else {
          const getDetails = (cards, comboTotal) => {
             let d = `Cards(${cards})`;
             if (comboTotal > 0) d += ` + Combos(${comboTotal})`;
             return d + ` = ${cards + comboTotal}`;
          };

          finalPoints[attacker] = (totalAttackerPoints) * multiplier;
          finalPoints[defender] = (defenderCards + defenderCombos);
          
          calculationDetails[attacker] = getDetails(attackerCards, attackerCombos) + (multiplier > 1 ? ` (X${multiplier})` : '');
          calculationDetails[defender] = getDetails(defenderCards, defenderCombos);
        }

        const newHistoryItem = {
          roundNum: game.history.length + 1,
          bidStr: `${roundState.suit} ${bid}${isKaput ? ' (Kaput)' : ''}`,
          attacker,
          pointsGained: finalPoints,
          details: calculationDetails
        };

        onUpdate({
          teams: game.teams.map((t, i) => ({ ...t, total: t.total + finalPoints[i] })),
          dealer: (game.dealer + 1) % 2,
          history: [...game.history, newHistoryItem]
        });
        
        setRoundState(getInitialRoundState());
        setActiveTab('bid');
        setIsRoundModalOpen(false);
      };

      return (
        <div className="min-h-screen flex flex-col p-4 relative pb-24">
          {/* Top Bar */}
          <div className="flex justify-between items-center mb-4 text-sm font-bold text-gray-400">
             <button onClick={onExit} className="bg-darkPanel px-4 py-2 rounded-xl border border-gray-800 flex items-center gap-2 active:scale-95 transition-colors">
                ← Menu
             </button>
             <div className="bg-gray-900 px-3 py-1 rounded-lg">TARGET: {game.targetScore}</div>
          </div>

          {/* Header / Scoreboard */}
          <div className="flex justify-between items-end bg-darkPanel p-6 rounded-3xl mb-6 shadow-xl border border-gray-800">
            {game.teams.map((team, idx) => (
              <div key={idx} className={`flex flex-col ${idx === 1 ? 'items-end' : 'items-start'} w-1/2`}>
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-gray-400 font-bold text-lg">{team.name}</span>
                  {game.dealer === idx && <span className="text-neonBlue text-sm bg-blue-900/30 px-2 py-1 rounded">DEALER</span>}
                </div>
                <span className={`text-6xl font-black ${idx === 0 ? 'text-neonBlue' : 'text-neonPink'}`}>
                  {team.total}
                </span>
              </div>
            ))}
          </div>

          {/* Match History */}
          <div className="flex-1 overflow-y-auto space-y-3 pb-8">
            {game.history.map((h, i) => (
              <div key={i} className="bg-darkPanel p-4 rounded-xl text-sm border border-gray-800/50">
                <div className="flex justify-between font-bold mb-2">
                  <span className="text-gray-400">Round {h.roundNum} • {h.bidStr}</span>
                  <span className="text-white bg-gray-800 px-2 py-0.5 rounded text-xs">Attacker: {game.teams[h.attacker].name}</span>
                </div>
                <div className="flex justify-between text-xs text-gray-400 mt-1">
                  <div className="w-1/2 pr-2">
                    <span className="text-neonBlue font-bold block mb-1">+{h.pointsGained[0]}</span>
                    <span className="opacity-70 leading-tight block">{h.details[0]}</span>
                  </div>
                  <div className="w-1/2 pl-2 text-right">
                    <span className="text-neonPink font-bold block mb-1">+{h.pointsGained[1]}</span>
                    <span className="opacity-70 leading-tight block">{h.details[1]}</span>
                  </div>
                </div>
              </div>
            ))}
            {game.history.length === 0 && <div className="text-center text-gray-600 mt-10">No rounds played yet.</div>}
          </div>

          {/* Bottom Actions */}
          <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-darkBg via-darkBg to-transparent flex gap-3">
             <button 
              onClick={revertLastRound}
              disabled={game.history.length === 0 || isGameOver}
              className="bg-gray-800 p-4 rounded-2xl font-bold disabled:opacity-30 active:scale-95 transition-transform"
            >
              ↩ Undo
            </button>
            <button 
              onClick={() => isGameOver ? onExit() : setIsRoundModalOpen(true)}
              className="flex-1 py-4 rounded-2xl font-black text-xl bg-neonBlue text-black shadow-[0_0_20px_rgba(0,243,255,0.4)] active:scale-95 transition-transform"
            >
              {isGameOver ? 'BACK TO MENU' : 'NEW ROUND'}
            </button>
          </div>
          
          {/* Victory Overlay */}
          {isGameOver && (
            <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-30 p-6 text-center">
              <h2 className="text-6xl font-black text-yellow-400 mb-4 animate-bounce">VICTORY!</h2>
              <p className="text-3xl font-bold mb-8">{winner.name} wins with {winner.total} pts.</p>
              <button 
                onClick={onExit}
                className="w-full py-5 rounded-2xl font-black text-2xl bg-white text-black active:scale-95 transition-transform"
              >
                RETURN TO MENU
              </button>
            </div>
          )}

          {/* Round Modal */}
          {isRoundModalOpen && (
            <div className="fixed inset-0 bg-darkBg flex flex-col z-50 overflow-hidden">
              <div className="flex bg-darkPanel p-2 gap-2 mt-4 mx-4 rounded-2xl">
                {['bid', 'combos', 'score'].map(tab => (
                  <button 
                    key={tab} onClick={() => setActiveTab(tab)}
                    className={`flex-1 py-3 text-sm font-bold uppercase rounded-xl transition-colors ${activeTab === tab ? 'bg-gray-700 text-white shadow-md' : 'text-gray-500'}`}
                  >
                    {tab}
                  </button>
                ))}
              </div>

              <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
                
                {/* --- TAB: BIDDING --- */}
                {activeTab === 'bid' && (
                  <div className="space-y-8">
                    <div className="space-y-3">
                      <label className="text-gray-400 font-bold uppercase text-sm">Who won the bid?</label>
                      <div className="flex bg-gray-900 rounded-2xl p-1 border border-gray-800">
                        <button onClick={() => setRoundState(r => ({...r, attacker: 0}))}
                          className={`flex-1 py-4 text-xl font-bold rounded-xl transition-all ${roundState.attacker === 0 ? 'bg-neonBlue text-black' : 'text-gray-500'}`}>{game.teams[0].name}</button>
                        <button onClick={() => setRoundState(r => ({...r, attacker: 1}))}
                          className={`flex-1 py-4 text-xl font-bold rounded-xl transition-all ${roundState.attacker === 1 ? 'bg-neonPink text-black' : 'text-gray-500'}`}>{game.teams[1].name}</button>
                      </div>
                    </div>

                    <div className="space-y-3">
                      <label className="text-gray-400 font-bold uppercase text-sm">Trump Suit</label>
                      <div className="grid grid-cols-5 gap-2">
                        {['♠️', '♥️', '♦️', '♣️', 'NT'].map(s => (
                          <button key={s} onClick={() => setRoundState(r => ({...r, suit: s}))}
                            className={`py-4 text-2xl rounded-2xl border transition-all ${roundState.suit === s ? 'border-white bg-gray-800' : 'border-gray-800 bg-darkPanel text-opacity-50'}`}>
                            {s}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-3 bg-darkPanel p-6 rounded-3xl border border-gray-800">
                      <div className="flex justify-between items-end mb-4">
                        <label className="text-gray-400 font-bold uppercase text-sm">Bid Amount</label>
                        <div className="flex items-center gap-2">
                          <input type="checkbox" id="kaput" className="w-5 h-5 accent-neonPink" checked={roundState.isKaput} 
                            onChange={(e) => setRoundState(r => ({...r, isKaput: e.target.checked, bid: e.target.checked && r.bid < 25 ? 25 : r.bid}))} />
                          <label htmlFor="kaput" className="font-bold text-neonPink">KAPUT</label>
                        </div>
                      </div>
                      <div className="text-center text-6xl font-black mb-4">
                        {roundState.bid}
                      </div>
                      <input 
                        type="range" min={roundState.isKaput ? 25 : 8} max="50" step="1" 
                        value={roundState.bid} 
                        onChange={(e) => setRoundState(r => ({...r, bid: parseInt(e.target.value)}))}
                        className={roundState.attacker === 0 ? '' : 'slider-pink'}
                      />
                    </div>

                    <div className="flex gap-2">
                      {['none', 'kontra', 'rekontra'].map(mult => (
                        <button key={mult} onClick={() => setRoundState(r => ({...r, multiplier: MULTIPLIERS[mult]}))}
                          className={`flex-1 py-3 font-bold uppercase text-sm rounded-xl border ${roundState.multiplier === MULTIPLIERS[mult] ? 'bg-white text-black' : 'border-gray-800 text-gray-500'}`}>
                          {mult}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* --- TAB: COMBOS --- */}
                {activeTab === 'combos' && (
                  <div className="space-y-6 flex-1">
                     <div className="flex gap-4">
                        <div className="flex-1 space-y-2">
                          <div className="text-center text-neonBlue font-bold pb-2">{game.teams[0].name}</div>
                          {Object.keys(COMBO_VALUES).map(combo => (
                            <div key={'t0'+combo} className="flex justify-between items-center bg-darkPanel p-3 rounded-xl">
                              <span className="text-xs font-bold text-gray-400 capitalize">{combo.replace(/([A-Z])/g, ' $1').trim()}</span>
                              <div className="flex gap-2 items-center">
                                <button onClick={() => setRoundState(r => ({...r, combos: {...r.combos, 0: {...r.combos[0], [combo]: Math.max(0, r.combos[0][combo] - 1)}}}))}
                                  className="w-8 h-8 bg-gray-800 rounded-full font-bold text-white">-</button>
                                <span className="w-4 text-center font-bold">{roundState.combos[0][combo]}</span>
                                <button onClick={() => setRoundState(r => ({...r, combos: {...r.combos, 0: {...r.combos[0], [combo]: r.combos[0][combo] + 1}}}))}
                                  className="w-8 h-8 bg-blue-900 rounded-full font-bold text-neonBlue">+</button>
                              </div>
                            </div>
                          ))}
                        </div>

                        <div className="flex-1 space-y-2">
                          <div className="text-center text-neonPink font-bold pb-2">{game.teams[1].name}</div>
                          {Object.keys(COMBO_VALUES).map(combo => (
                            <div key={'t1'+combo} className="flex justify-between items-center bg-darkPanel p-3 rounded-xl">
                              <span className="text-xs font-bold text-gray-400 capitalize">{combo.replace(/([A-Z])/g, ' $1').trim()}</span>
                              <div className="flex gap-2 items-center">
                                <button onClick={() => setRoundState(r => ({...r, combos: {...r.combos, 1: {...r.combos[1], [combo]: Math.max(0, r.combos[1][combo] - 1)}}}))}
                                  className="w-8 h-8 bg-gray-800 rounded-full font-bold text-white">-</button>
                                <span className="w-4 text-center font-bold">{roundState.combos[1][combo]}</span>
                                <button onClick={() => setRoundState(r => ({...r, combos: {...r.combos, 1: {...r.combos[1], [combo]: r.combos[1][combo] + 1}}}))}
                                  className="w-8 h-8 bg-pink-900 rounded-full font-bold text-neonPink">+</button>
                              </div>
                            </div>
                          ))}
                        </div>
                     </div>
                  </div>
                )}

                {/* --- TAB: SCORE --- */}
                {activeTab === 'score' && (
                  <div className="space-y-6 flex flex-col justify-center flex-1">
                    
                    {/* Baite Force Toggle */}
                    <div className={`flex items-center justify-between p-5 rounded-2xl border-2 transition-all ${roundState.forcedBaite ? 'bg-red-900/20 border-red-500 shadow-[0_0_20px_rgba(255,0,0,0.2)]' : 'bg-darkPanel border-gray-800'}`}>
                      <div className="flex-1">
                        <span className={`font-bold text-lg block ${roundState.forcedBaite ? 'text-red-400' : 'text-gray-400'}`}>ATTACKER FAILED (BAITE)</span>
                        <span className="text-xs text-gray-500">Auto-calculate opponent's max score</span>
                      </div>
                      <input 
                        type="checkbox" 
                        className="w-7 h-7 accent-red-500"
                        checked={roundState.forcedBaite} 
                        onChange={(e) => setRoundState(r => ({...r, forcedBaite: e.target.checked}))} 
                      />
                    </div>

                    {!roundState.forcedBaite ? (
                      <>
                        <div className="text-center space-y-1 mt-4">
                          <p className="text-gray-400 font-bold tracking-widest text-sm">TOTAL RAW SCORE (162)</p>
                          <p className="text-xs text-gray-600">Slide to allocate points</p>
                        </div>

                        <div className="bg-darkPanel p-6 rounded-3xl border border-gray-800 space-y-8 relative overflow-hidden">
                          <div className="flex justify-between items-end relative z-10">
                            <div className="text-left">
                              <div className="text-neonBlue text-sm font-bold mb-1">{game.teams[0].name}</div>
                              <div className="text-5xl font-black">{roundState.rawScoreA}</div>
                              <div className="text-gray-400 font-bold mt-2">→ {calculatePoints(roundState.rawScoreA)} pts</div>
                            </div>
                            <div className="text-right">
                              <div className="text-neonPink text-sm font-bold mb-1">{game.teams[1].name}</div>
                              <div className="text-5xl font-black">{162 - roundState.rawScoreA}</div>
                              <div className="text-gray-400 font-bold mt-2">→ {calculatePoints(162 - roundState.rawScoreA)} pts</div>
                            </div>
                          </div>

                          <input 
                            type="range" min="0" max="162" step="1" 
                            value={roundState.rawScoreA} 
                            onChange={(e) => setRoundState(r => ({...r, rawScoreA: parseInt(e.target.value)}))}
                            className="relative z-10 slider-pink"
                          />
                        </div>

                        <div className="flex items-center justify-between bg-darkPanel p-4 rounded-2xl border border-gray-800">
                          <span className="font-bold text-gray-300 text-sm">Who took the last trick? (+10 Raw)</span>
                          <div className="flex bg-gray-900 rounded-xl p-1">
                             <button onClick={() => setRoundState(r => ({...r, lastTrick: 0}))}
                              className={`px-3 py-2 text-sm font-bold rounded-lg ${roundState.lastTrick === 0 ? 'bg-neonBlue text-black' : 'text-gray-500'}`}>{game.teams[0].name}</button>
                             <button onClick={() => setRoundState(r => ({...r, lastTrick: 1}))}
                              className={`px-3 py-2 text-sm font-bold rounded-lg ${roundState.lastTrick === 1 ? 'bg-neonPink text-black' : 'text-gray-500'}`}>{game.teams[1].name}</button>
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="flex-1 flex items-center justify-center">
                        <div className="text-center p-8 text-gray-400 border border-red-900/30 rounded-3xl bg-darkPanel w-full">
                            <p className="text-2xl font-black text-white mb-3">Round Failed</p>
                            <p className="text-sm">The defending team will receive the bid amount, all 16 card points, and all submitted combo points.</p>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Footer Actions */}
              <div className="p-4 flex gap-3 bg-darkBg border-t border-gray-800">
                <button 
                  onClick={() => setIsRoundModalOpen(false)}
                  className="py-4 px-6 rounded-2xl font-bold bg-gray-800 active:scale-95 transition-transform"
                >
                  Cancel
                </button>
                <button 
                  onClick={activeTab === 'score' ? resolveRound : () => setActiveTab(activeTab === 'bid' ? 'combos' : 'score')}
                  className="flex-1 py-4 rounded-2xl font-black text-xl bg-white text-black active:scale-95 transition-transform"
                >
                  {activeTab === 'score' ? 'SUBMIT ROUND' : 'NEXT STEP'}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN APP (State Container) ---
    function App() {
      const [games, setGames] = useState(() => {
        let loadedGames = JSON.parse(localStorage.getItem('blotmate_games') || '[]');
        
        // Migrate legacy single game state if it exists
        const legacy = localStorage.getItem('blotmate_state');
        if (legacy) {
          try {
            const parsed = JSON.parse(legacy);
            if (!parsed.id && parsed.teams) {
              const newGame = {
                id: Date.now().toString(),
                date: Date.now(),
                lastPlayed: Date.now(),
                targetScore: parsed.targetScore || 151,
                dealer: parsed.dealer || 0,
                teams: parsed.teams,
                history: parsed.history || []
              };
              loadedGames = [newGame, ...loadedGames];
              localStorage.removeItem('blotmate_state');
              localStorage.setItem('blotmate_games', JSON.stringify(loadedGames));
            }
          } catch(e) {}
        }
        return loadedGames;
      });

      const [activeGameId, setActiveGameId] = useState(() => localStorage.getItem('blotmate_active_game_id'));
      const [view, setView] = useState(() => activeGameId ? 'game' : 'list'); // list, setup, game

      // Persist state
      useEffect(() => {
        localStorage.setItem('blotmate_games', JSON.stringify(games));
        if (activeGameId) {
          localStorage.setItem('blotmate_active_game_id', activeGameId);
        } else {
          localStorage.removeItem('blotmate_active_game_id');
        }
      }, [games, activeGameId]);

      const handleStartNewGame = (target, team1, team2) => {
        const newGame = {
          id: Date.now().toString(),
          date: Date.now(),
          lastPlayed: Date.now(),
          targetScore: target,
          dealer: 0,
          teams: [
            { id: 0, name: team1 || 'Us', total: 0 },
            { id: 1, name: team2 || 'Them', total: 0 }
          ],
          history: []
        };
        setGames(prev => [newGame, ...prev]);
        setActiveGameId(newGame.id);
        setView('game');
      };

      const handleUpdateActiveGame = (updates) => {
        setGames(prev => prev.map(g => {
          if (g.id === activeGameId) {
             return { ...g, ...updates, lastPlayed: Date.now() };
          }
          return g;
        }));
      };

      const handleDeleteGame = (id) => {
        if (confirm("Are you sure you want to delete this game history?")) {
           setGames(prev => prev.filter(g => g.id !== id));
           if (activeGameId === id) {
             setActiveGameId(null);
             setView('list');
           }
        }
      };

      const handleResume = (id) => {
        setActiveGameId(id);
        setView('game');
      };

      const handleExitGame = () => {
        setActiveGameId(null);
        setView('list');
      };

      const activeGame = games.find(g => g.id === activeGameId);

      return (
        <div className="max-w-md mx-auto relative bg-darkBg shadow-2xl overflow-hidden min-h-screen border-x border-gray-900/30">
          {view === 'list' && (
            <GamesList 
              games={games} 
              onNewGame={() => setView('setup')} 
              onResume={handleResume} 
              onDelete={handleDeleteGame} 
            />
          )}
          {view === 'setup' && (
            <SetupScreen 
              onStart={handleStartNewGame} 
              onCancel={() => setView('list')} 
            />
          )}
          {view === 'game' && activeGame && (
            <GameBoard 
              game={activeGame} 
              onUpdate={handleUpdateActiveGame} 
              onExit={handleExitGame} 
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
